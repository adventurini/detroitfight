<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0A0A0A;color:#D8D8D8;display:flex;flex-direction:column;align-items:center;padding:16px;gap:16px}

<body>

<img class="lp-logo" src="images/DFC_Logo.png" alt="Detroit Fight Company">

<h1 class="lp-headline">Claim Your Free Trial Class Today!</h1>

<p>Only a few spots left.</p>

<div id="countdown">00:00:00</div>

<div class="form-wrap">
<iframe
src="https://api.leadconnectorhq.com/widget/form/npKsq7mUkXVSFyhuLF69"

data-activation-type="alwaysActivated"
data-activation-value=""
data-deactivation-type="neverDeactivate"

title="Google Ads Funnel Form"
>
</iframe>
<script src="https://link.msgsndr.com/js/form_embed.js"></script>
</div>

<script>
(function(){
  var el=document.getElementById('countdown');
  function tick(){
    var now=new Date();
    var next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
    var ms=next-now;
    var h=Math.floor(ms/3600000);
    var m=Math.floor((ms%3600000)/60000);
    var s=Math.floor((ms%60000)/1000);
    el.textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  tick();
  setInterval(tick,1000);
})();
</script>
